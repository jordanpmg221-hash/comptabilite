<!-- HTML : Zone OCR enrichie avec option Appareil Photo / Smartphone -->
<div className="grid grid-cols-1 md:grid-cols-2 gap-6">
  <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl flex flex-col items-center justify-center min-h-[380px]">
    
    <!-- Input invisible pour l'appareil photo du smartphone -->
    <input 
      type="file" 
      id="cameraInput" 
      accept="image/*" 
      capture="environment" 
      class="hidden" 
      onchange="handleFileSelect(event)"
    />
    
    <!-- Input invisible pour la galerie / fichier local -->
    <input 
      type="file" 
      id="fileInput" 
      accept="image/*,application/pdf" 
      class="hidden" 
      onchange="handleFileSelect(event)"
    />

    <div 
      id="dropZone"
      className="w-full h-full border-2 border-dashed border-slate-700 hover:border-slate-500 rounded-xl p-8 flex flex-col items-center justify-center text-center cursor-pointer transition-all"
    >
      <div className="bg-emerald-500/10 p-4 rounded-full text-emerald-400 mb-3">
        <i data-lucide="camera" class="h-8 w-8"></i>
      </div>
      
      <p className="text-sm font-medium text-slate-200 mb-1">
        Numérisez vos factures & reçus informels
      </p>
      <p className="text-xs text-slate-500 mb-4">
        Glissez un fichier ou prenez directement une photo
      </p>

      <!-- BOUTONS D'ACTION SUR SMARTPHONE & DESKTOP -->
      <div className="flex flex-wrap justify-center gap-3 w-full max-w-xs z-10">
        <button 
          type="button"
          onclick="document.getElementById('cameraInput').click()" 
          className="flex-1 py-2.5 px-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold text-xs rounded-lg flex items-center justify-center transition-all shadow-lg shadow-emerald-500/20"
        >
          <i data-lucide="camera" class="h-4 w-4 mr-1.5"></i>
          Prendre en photo
        </button>

        <button 
          type="button"
          onclick="document.getElementById('fileInput').click()" 
          className="flex-1 py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold text-xs rounded-lg flex items-center justify-center transition-all"
        >
          <i data-lucide="upload" class="h-4 w-4 mr-1.5"></i>
          Galerie / PDF
        </button>
      </div>
    </div>
  </div>

  <!-- ZONE DE PRÉVISUALISATION ET RÉSULTAT OCR SYSCOHADA -->
  <div id="ocrResultContainer" className="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
    <!-- Le résultat s'affiche ici dynamiquement après scan -->
  </div>
</div>

<script>
// JavaScript : Gestion de la caméra et de l'analyse OCR
function handleFileSelect(event) {
  const files = event.target.files;
  if (files && files[0]) {
    const file = files[0];
    const fileName = file.name || "Photo_Reçu_Mobile.jpg";
    
    // Si c'est une photo/image, prévisualiser avant analyse
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = function(e) {
        triggerOCRWithPreview(fileName, e.target.result);
      };
      reader.readAsDataURL(file);
    } else {
      triggerOCR(fileName);
    }
  }
}

function triggerOCRWithPreview(fileName, imageSrc) {
  const container = document.getElementById('ocrResultContainer');
  if (!container) return;

  container.innerHTML = `
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <h3 class="text-sm font-semibold text-slate-200 flex items-center">
        <i data-lucide="file-check" class="h-4 w-4 mr-2 text-emerald-400"></i>
        Analyse de la pièce capturée
      </h3>
      <span class="text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full font-mono animate-pulse">
        Traitement IA...
      </span>
    </div>

    <!-- Aperçu de la photo prise avec le mobile -->
    <div class="relative h-40 w-full overflow-hidden rounded-lg border border-slate-700 bg-slate-950 flex items-center justify-center">
      <img src="${imageSrc}" alt="Capture reçu" class="h-full object-contain" />
    </div>

    <div class="space-y-3 text-xs">
      <div class="bg-slate-800/60 p-3 rounded-lg space-y-2 border border-slate-700">
        <div class="flex justify-between">
          <span class="text-slate-400">Fichier :</span>
          <span class="font-mono text-slate-200">${fileName}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-400">Fournisseur :</span>
          <span class="font-semibold text-slate-200">Station Touba Pétrole</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-400">Montant HT / TTC :</span>
          <span class="font-mono text-emerald-400">50 000 / 59 000 FCFA (TVA 18%)</span>
        </div>
      </div>

      <div class="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-lg space-y-1.5">
        <span class="text-emerald-400 font-semibold block">Imputation SYSCOHADA suggérée :</span>
        <div class="font-mono text-slate-200 text-[11px] space-y-1">
          <p>• Débit : <span class="text-emerald-300">6053 - Carburants et lubrifiants (50 000 FCFA)</span></p>
          <p>• Débit : <span class="text-emerald-300">4452 - État, TVA récupérable (9 000 FCFA)</span></p>
          <p>• Crédit : <span class="text-emerald-300">5711 - Caisse Principale (59 000 FCFA)</span></p>
        </div>
      </div>

      <button onclick="confirmEntry()" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-lg text-xs transition-all shadow-md">
        Valider et Enregistrer dans le Grand Livre
      </button>
    </div>
  `;

  // Réinitialiser les icônes Lucide pour la zone dynamique
  if (window.lucide) {
    window.lucide.createIcons();
  }
}
</script>
